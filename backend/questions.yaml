# -----------------------------------
# Quiz App - Sample Questions YAML
# -----------------------------------
# This file contains quiz questions in two types:
# 1. multiple_choice - Standard MCQ questions
# 2. parsons - Drag-and-drop code ordering
#
# Categories: python, java, technology

quizzes:
  # -----------------------------------
  # Quiz 1: Python Fundamentals
  # -----------------------------------
  - id: python_basics_01
    title: "Python Fundamentals"
    description: "Test your knowledge of basic Python concepts"
    category: "python"
    questions:

      - id: q1
        type: "multiple_choice"
        prompt: "Which keyword is used to create a function in Python?"
        options:
          - "func"
          - "define"
          - "def"
          - "function"
        answer: "def"

      - id: q2
        type: "parsons"
        prompt: "Reorder these blocks to create a valid 'for' loop that prints numbers 0-4."
        blocks:
          - "for i in range(5):"
          - "    print(i)"
        answer: [0, 1]

      - id: q3
        type: "multiple_choice"
        prompt: "What is the output of: print(type([]))"
        options:
          - "<class 'tuple'>"
          - "<class 'list'>"
          - "<class 'dict'>"
          - "<class 'set'>"
        answer: "<class 'list'>"

      - id: q4
        type: "multiple_choice"
        prompt: "Which method adds an element to the end of a list?"
        options:
          - "add()"
          - "insert()"
          - "append()"
          - "extend()"
        answer: "append()"

      - id: q5
        type: "parsons"
        prompt: "Arrange these lines to create a function that returns the sum of two numbers."
        blocks:
          - "def add_numbers(a, b):"
          - "    result = a + b"
          - "    return result"
        answer: [0, 1, 2]

      - id: q6
        type: "multiple_choice"
        prompt: "Which symbol is used for single-line comments in Python?"
        options:
          - "//"
          - "/*"
          - "#"
          - "--"
        answer: "#"

      - id: q7
        type: "parsons"
        prompt: "Arrange the code to ask the user for their name and print a greeting."
        blocks:
          - "name = input('Enter name: ')"
          - "print('Hello, ' + name)"
        answer: [0, 1]

      - id: q8
        type: "multiple_choice"
        prompt: "What is the correct file extension for Python files?"
        options:
          - ".pt"
          - ".pyt"
          - ".py"
          - ".python"
        answer: ".py"

      - id: q9
        type: "multiple_choice"
        prompt: "Which operator is used for exponentiation (power) in Python?"
        options:
          - "^"
          - "**"
          - "//"
          - "pow"
        answer: "**"

      - id: q10
        type: "parsons"
        prompt: "Reorder the blocks to create an 'if-else' statement checking if a score is passing."
        blocks:
          - "score = 75"
          - "if score >= 60:"
          - "    print('Passed')"
          - "else:"
          - "    print('Failed')"
        answer: [0, 1, 2, 3, 4]

      - id: q11
        type: "multiple_choice"
        prompt: "What is the output of: print(10 // 3)?"
        options:
          - "3.33"
          - "3"
          - "4"
          - "3.0"
        answer: "3"

      - id: q12
        type: "multiple_choice"
        prompt: "How do you cast the string '5' to an integer?"
        options:
          - "str(5)"
          - "int('5')"
          - "float('5')"
          - "cast('5', int)"
        answer: "int('5')"

      - id: q13
        type: "parsons"
        prompt: "Create a loop that counts down from 3 to 1."
        blocks:
          - "count = 3"
          - "while count > 0:"
          - "    print(count)"
          - "    count -= 1"
        answer: [0, 1, 2, 3]

      - id: q14
        type: "multiple_choice"
        prompt: "Which boolean operator returns True only if both statements are true?"
        options:
          - "or"
          - "not"
          - "and"
          - "xor"
        answer: "and"

      - id: q15
        type: "multiple_choice"
        prompt: "What is the correct syntax to output 'Hello World' in Python?"
        options:
          - "echo 'Hello World'"
          - "p('Hello World')"
          - "print('Hello World')"
          - "System.out.println('Hello World')"
        answer: "print('Hello World')"

  # -----------------------------------
  # Quiz 2: Python Data Structures
  # -----------------------------------
  - id: python_data_structures
    title: "Python Data Structures"
    description: "Learn about lists, dictionaries, tuples, and sets"
    category: "python"
    questions:

      - id: ds_q1
        type: "multiple_choice"
        prompt: "How do you access the value for key 'name' in a dictionary called 'person'?"
        options:
          - "person.name"
          - "person['name']"
          - "person(name)"
          - "person->name"
        answer: "person['name']"

      - id: ds_q2
        type: "parsons"
        prompt: "Arrange these lines to create a dictionary and print a value."
        blocks:
          - "my_dict = {'color': 'blue', 'size': 'large'}"
          - "print(my_dict['color'])"
        answer: [0, 1]

      - id: ds_q3
        type: "multiple_choice"
        prompt: "Which data structure does NOT allow duplicate values?"
        options:
          - "list"
          - "tuple"
          - "set"
          - "dictionary"
        answer: "set"

      - id: ds_q4
        type: "multiple_choice"
        prompt: "Which data structure is immutable (cannot be changed after creation)?"
        options:
          - "List"
          - "Dictionary"
          - "Tuple"
          - "Set"
        answer: "Tuple"

      - id: ds_q5
        type: "multiple_choice"
        prompt: "What is the syntax to create an empty list?"
        options:
          - "[]"
          - "{}"
          - "()"
          - "List.new()"
        answer: "[]"

      - id: ds_q6
        type: "parsons"
        prompt: "Arrange the code to iterate through a list of fruits."
        blocks:
          - "fruits = ['apple', 'banana', 'cherry']"
          - "for x in fruits:"
          - "    print(x)"
        answer: [0, 1, 2]

      - id: ds_q7
        type: "multiple_choice"
        prompt: "What does the len() function return?"
        options:
          - "The last item in a list"
          - "The first item in a list"
          - "The number of items in an object"
          - "The memory size of an object"
        answer: "The number of items in an object"

      - id: ds_q8
        type: "multiple_choice"
        prompt: "In a dictionary, keys must be:"
        options:
          - "Mutable"
          - "Immutable"
          - "Integers only"
          - "Strings only"
        answer: "Immutable"

      - id: ds_q9
        type: "parsons"
        prompt: "Reorder code to add 'Zelda' to a game inventory list."
        blocks:
          - "inventory = ['Mario', 'Sonic']"
          - "inventory.append('Zelda')"
          - "print(inventory)"
        answer: [0, 1, 2]

      - id: ds_q10
        type: "multiple_choice"
        prompt: "How do you access the second item in a list named 'loot'?"
        options:
          - "loot[1]"
          - "loot[2]"
          - "loot(1)"
          - "loot.second()"
        answer: "loot[1]"

      - id: ds_q11
        type: "multiple_choice"
        prompt: "What is the result of slicing: my_list[1:3]?"
        options:
          - "Items at index 1, 2, and 3"
          - "Items at index 1 and 2"
          - "Items at index 0, 1, and 2"
          - "Items at index 2 and 3"
        answer: "Items at index 1 and 2"

      - id: ds_q12
        type: "parsons"
        prompt: "Arrange code to verify if a key exists in a dictionary."
        blocks:
          - "player = {'hp': 100, 'mp': 50}"
          - "if 'hp' in player:"
          - "    print('Health found')"
        answer: [0, 1, 2]

      - id: ds_q13
        type: "multiple_choice"
        prompt: "Which method removes the last item from a list?"
        options:
          - "delete()"
          - "remove()"
          - "pop()"
          - "push()"
        answer: "pop()"

      - id: ds_q14
        type: "multiple_choice"
        prompt: "Which syntax creates a tuple?"
        options:
          - "{1, 2, 3}"
          - "[1, 2, 3]"
          - "(1, 2, 3)"
          - "<1, 2, 3>"
        answer: "(1, 2, 3)"

      - id: ds_q15
        type: "parsons"
        prompt: "Create a nested list representing a 2D grid."
        blocks:
          - "row1 = [1, 2]"
          - "row2 = [3, 4]"
          - "grid = [row1, row2]"
        answer: [0, 1, 2]

  # -----------------------------------
  # Quiz 3: Java Basics
  # -----------------------------------
  - id: java_basics_01
    title: "Java Fundamentals"
    description: "Test your knowledge of basic Java concepts"
    category: "java"
    questions:

      - id: java_q1
        type: "multiple_choice"
        prompt: "Which keyword is used to create a class in Java?"
        options:
          - "def"
          - "class"
          - "struct"
          - "type"
        answer: "class"

      - id: java_q2
        type: "multiple_choice"
        prompt: "What is the correct way to declare a main method in Java?"
        options:
          - "def main():"
          - "function main()"
          - "public static void main(String[] args)"
          - "void main()"
        answer: "public static void main(String[] args)"

      - id: java_q3
        type: "multiple_choice"
        prompt: "Which data type is used to store text?"
        options:
          - "string"
          - "String"
          - "Txt"
          - "Char"
        answer: "String"

      - id: java_q4
        type: "multiple_choice"
        prompt: "How do you end a statement in Java?"
        options:
          - "."
          - ":"
          - ";"
          - "}"
        answer: ";"

      - id: java_q5
        type: "parsons"
        prompt: "Arrange the code to print 'Hello Java' to the console."
        blocks:
          - "public class Main {"
          - "    public static void main(String[] args) {"
          - "        System.out.println(\"Hello Java\");"
          - "    }"
          - "}"
        answer: [0, 1, 2, 3, 4]

      - id: java_q6
        type: "multiple_choice"
        prompt: "Which variable type stores whole numbers?"
        options:
          - "float"
          - "int"
          - "double"
          - "boolean"
        answer: "int"

      - id: java_q7
        type: "parsons"
        prompt: "Reorder to declare an integer and assign it a value."
        blocks:
          - "int myNum;"
          - "myNum = 15;"
          - "System.out.println(myNum);"
        answer: [0, 1, 2]

      - id: java_q8
        type: "multiple_choice"
        prompt: "How do you write a single-line comment in Java?"
        options:
          - "#"
          - "//"
          - "/*"
          - "--"
        answer: "//"

      - id: java_q9
        type: "multiple_choice"
        prompt: "Which keyword creates a variable that cannot be changed (constant)?"
        options:
          - "static"
          - "final"
          - "const"
          - "abstract"
        answer: "final"

      - id: java_q10
        type: "parsons"
        prompt: "Construct a standard 'if' statement in Java."
        blocks:
          - "int x = 20;"
          - "if (x > 18) {"
          - "    System.out.println(\"Adult\");"
          - "}"
        answer: [0, 1, 2, 3]

      - id: java_q11
        type: "multiple_choice"
        prompt: "Which operator is used to compare two values for equality?"
        options:
          - "="
          - "=="
          - "<>"
          - "equals"
        answer: "=="

      - id: java_q12
        type: "multiple_choice"
        prompt: "Arrays in Java are initialized with which brackets?"
        options:
          - "()"
          - "[]"
          - "{}"
          - "<>"
        answer: "{}"

      - id: java_q13
        type: "parsons"
        prompt: "Create a simple 'for' loop counting from 0 to 4."
        blocks:
          - "for (int i = 0; i < 5; i++) {"
          - "    System.out.println(i);"
          - "}"
        answer: [0, 1, 2]

      - id: java_q14
        type: "multiple_choice"
        prompt: "Which data type stores true or false values?"
        options:
          - "bool"
          - "Boolean"
          - "boolean"
          - "bit"
        answer: "boolean"

      - id: java_q15
        type: "multiple_choice"
        prompt: "Which symbol calculates the remainder (modulus)?"
        options:
          - "/"
          - "%"
          - "*"
          - "\\"
        answer: "%"

  # -----------------------------------
  # Quiz 5: Java OOP & Logic
  # -----------------------------------
  - id: java_oop_01
    title: "Java OOP & Logic"
    description: "Object-Oriented Programming concepts and logic"
    category: "java"
    questions:
      - id: java_oop_q1
        type: "multiple_choice"
        prompt: "Which concept allows a class to acquire properties and methods from another class?"
        options:
          - "Polymorphism"
          - "Inheritance"
          - "Encapsulation"
          - "Abstraction"
        answer: "Inheritance"

      - id: java_oop_q2
        type: "parsons"
        prompt: "Arrange the code to create an object of class 'Car'."
        blocks:
          - "public class Main {"
          - "    public static void main(String[] args) {"
          - "        Car myCar = new Car();"
          - "    }"
          - "}"
        answer: [0, 1, 2, 3, 4]

      - id: java_oop_q3
        type: "multiple_choice"
        prompt: "Which keyword refers to the current object instance?"
        options:
          - "super"
          - "this"
          - "that"
          - "object"
        answer: "this"

      - id: java_oop_q4
        type: "multiple_choice"
        prompt: "Which access modifier makes a variable visible only within its own class?"
        options:
          - "public"
          - "protected"
          - "private"
          - "package"
        answer: "private"

      - id: java_oop_q5
        type: "parsons"
        prompt: "Order the code to handle an exception using try-catch."
        blocks:
          - "try {"
          - "    int data = 50 / 0;"
          - "} catch (ArithmeticException e) {"
          - "    System.out.println(e);"
          - "}"
        answer: [0, 1, 2, 3, 4]

      - id: java_oop_q6
        type: "multiple_choice"
        prompt: "What is a constructor?"
        options:
          - "A method that destroys objects"
          - "A special method called when an object is created"
          - "A variable that holds class data"
          - "A tool to build Java files"
        answer: "A special method called when an object is created"

      - id: java_oop_q7
        type: "multiple_choice"
        prompt: "Which keyword is used to import a package?"
        options:
          - "package"
          - "get"
          - "import"
          - "include"
        answer: "import"

      - id: java_oop_q8
        type: "parsons"
        prompt: "Create a subclass 'Dog' that extends 'Animal'."
        blocks:
          - "public class Animal {"
          - "}"
          - "public class Dog extends Animal {"
          - "}"
        answer: [0, 1, 2, 3]

      - id: java_oop_q9
        type: "multiple_choice"
        prompt: "Method Overloading occurs when..."
        options:
          - "A method has the same name but different parameters"
          - "A method is too long"
          - "A subclass provides a specific implementation of a method"
          - "A method calls itself"
        answer: "A method has the same name but different parameters"

      - id: java_oop_q10
        type: "parsons"
        prompt: "Arrange the enhanced for-loop to print all names in an array."
        blocks:
          - "String[] names = {\"Code\", \"Tech\"};"
          - "for (String i : names) {"
          - "    System.out.println(i);"
          - "}"
        answer: [0, 1, 2, 3]

      - id: java_oop_q11
        type: "multiple_choice"
        prompt: "An interface in Java is..."
        options:
          - "A concrete class with all methods defined"
          - "A blueprint of a class containing abstract methods"
          - "A graphical user window"
          - "A variable type"
        answer: "A blueprint of a class containing abstract methods"

      - id: java_oop_q12
        type: "multiple_choice"
        prompt: "What does the 'static' keyword mean?"
        options:
          - "The variable can change frequently"
          - "The member belongs to the class, not instances"
          - "The code is frozen"
          - "The method is private"
        answer: "The member belongs to the class, not instances"

      - id: java_oop_q13
        type: "parsons"
        prompt: "Order the code to define and call a method."
        blocks:
          - "static void myMethod() {"
          - "    System.out.println(\"Executed!\");"
          - "}"
          - "public static void main(String[] args) {"
          - "    myMethod();"
          - "}"
        answer: [0, 1, 2, 3, 4, 5]

      - id: java_oop_q14
        type: "multiple_choice"
        prompt: "Which package is automatically imported in all Java programs?"
        options:
          - "java.util"
          - "java.io"
          - "java.lang"
          - "java.net"
        answer: "java.lang"

      - id: java_oop_q15
        type: "multiple_choice"
        prompt: "What is the result of 10 > 9?"
        options:
          - "1"
          - "true"
          - "0"
          - "false"
        answer: "true"

  # -----------------------------------
  # Quiz 6: Technology Concepts
  # -----------------------------------
  - id: tech_concepts_01
    title: "Technology Concepts"
    description: "General technology and computer science concepts"
    category: "technology"
    questions:

      - id: tech_q1
        type: "multiple_choice"
        prompt: "What does CPU stand for?"
        options:
          - "Central Processing Unit"
          - "Computer Personal Unit"
          - "Central Program Utility"
          - "Computer Processing Utility"
        answer: "Central Processing Unit"

      - id: tech_q2
        type: "multiple_choice"
        prompt: "Which of the following is a version control system?"
        options:
          - "Git"
          - "Python"
          - "Java"
          - "HTML"
        answer: "Git"

      - id: tech_q3
        type: "multiple_choice"
        prompt: "What does RAM stand for?"
        options:
          - "Read Access Memory"
          - "Random Access Memory"
          - "Run All Memory"
          - "Real Access Module"
        answer: "Random Access Memory"

      - id: tech_q4
        type: "parsons"
        prompt: "Order these storage units from smallest to largest."
        blocks:
          - "Kilobyte (KB)"
          - "Megabyte (MB)"
          - "Gigabyte (GB)"
          - "Terabyte (TB)"
        answer: [0, 1, 2, 3]

      - id: tech_q5
        type: "multiple_choice"
        prompt: "Which protocol is used for secure web browsing?"
        options:
          - "HTTP"
          - "FTP"
          - "HTTPS"
          - "SMTP"
        answer: "HTTPS"

      - id: tech_q6
        type: "multiple_choice"
        prompt: "What is the binary representation of the decimal number 1?"
        options:
          - "10"
          - "01"
          - "11"
          - "00"
        answer: "01"

      - id: tech_q7
        type: "multiple_choice"
        prompt: "Which component is considered the 'brain' of the computer?"
        options:
          - "Hard Drive"
          - "RAM"
          - "CPU"
          - "GPU"
        answer: "CPU"

      - id: tech_q8
        type: "parsons"
        prompt: "Order the steps of the basic computing processing cycle."
        blocks:
          - "Input"
          - "Processing"
          - "Output"
          - "Storage"
        answer: [0, 1, 2, 3]

      - id: tech_q9
        type: "multiple_choice"
        prompt: "Which of these is an Operating System?"
        options:
          - "Linux"
          - "Chrome"
          - "Dell"
          - "Intel"
        answer: "Linux"

      - id: tech_q10
        type: "multiple_choice"
        prompt: "What is 'Phishing'?"
        options:
          - "Optimizing code for speed"
          - "A fraudulent attempt to obtain sensitive information"
          - "Repairing hardware connections"
          - "Searching for bugs in software"
        answer: "A fraudulent attempt to obtain sensitive information"

      - id: tech_q11
        type: "multiple_choice"
        prompt: "Which of the following is NOT a programming language?"
        options:
          - "Python"
          - "Java"
          - "HTML"
          - "C++"
        answer: "HTML"
      
      - id: tech_q12
        type: "parsons"
        prompt: "Arrange the layers of the OSI model from lowest to highest."
        blocks:
          - "Physical"
          - "Data Link"
          - "Network"
          - "Transport"
          - "Session"
          - "Presentation"
          - "Application"
        answer: [0, 1, 2, 3, 4, 5, 6]

      - id: tech_q13
        type: "multiple_choice"
        prompt: "What does 'HTTP' stand for?"
        options:
          - "HyperText Transfer Protocol"
          - "High Tech Transfer Protocol"
          - "Hyperlink Text Transfer Protocol"
          - "Home Transfer Text Protocol"
        answer: "HyperText Transfer Protocol"

      - id: tech_q14
        type: "multiple_choice"
        prompt: "Which of the following is a type of malware?"
        options:
          - "Firewall"
          - "Antivirus"
          - "Ransomware"
          - "VPN"
        answer: "Ransomware"
      
      - id: tech_q15
        type: "multiple_choice"
        prompt: "Which type of storage device has no moving parts and is faster than a traditional Hard Disk Drive (HDD)?"
        options:
          - "SSD (Solid State Drive)"
          - "DVD-ROM"
          - "Floppy Disk"
          - "Magnetic Tape"
        answer: "SSD (Solid State Drive)"

  # -----------------------------------
  # Quiz 7: Robotics Fundamentals
  # -----------------------------------
  - id: robotics_01
    title: "Robotics Fundamentals"
    description: "Sensors, actuators, and control logic"
    category: "technology"
    questions:
      - id: robo_q1
        type: "multiple_choice"
        prompt: "What is an Actuator?"
        options:
          - "A device that converts energy into motion"
          - "A sensor that detects light"
          - "The brain of the robot"
          - "A battery unit"
        answer: "A device that converts energy into motion"

      - id: robo_q2
        type: "parsons"
        prompt: "Order the logic for a simple obstacle avoidance robot."
        blocks:
          - "Read ultrasonic distance sensor"
          - "if distance < 10cm:"
          - "    stop motors"
          - "    turn right"
          - "else: drive forward"
        answer: [0, 1, 2, 3, 4]

      - id: robo_q3
        type: "multiple_choice"
        prompt: "Which sensor is best for measuring distance using sound waves?"
        options:
          - "Infrared"
          - "Ultrasonic"
          - "Gyroscope"
          - "Thermistor"
        answer: "Ultrasonic"

      - id: robo_q4
        type: "multiple_choice"
        prompt: "What does 'DOF' stand for in robotics?"
        options:
          - "Depth of Field"
          - "Degrees of Freedom"
          - "Digital Output Format"
          - "Direct Operating Frequency"
        answer: "Degrees of Freedom"

      - id: robo_q5
        type: "parsons"
        prompt: "Arrange the typical control loop of a robot."
        blocks:
          - "Sense (Input from environment)"
          - "Plan (Process data)"
          - "Act (Output to motors)"
        answer: [0, 1, 2]

      - id: robo_q6
        type: "multiple_choice"
        prompt: "What is the 'End Effector'?"
        options:
          - "The battery pack"
          - "The device at the end of a robotic arm (e.g., gripper)"
          - "The main power switch"
          - "The coding environment"
        answer: "The device at the end of a robotic arm (e.g., gripper)"

      - id: robo_q7
        type: "multiple_choice"
        prompt: "Which component is commonly used to control the precise angle of a joint?"
        options:
          - "DC Motor"
          - "Servo Motor"
          - "LED"
          - "Resistor"
        answer: "Servo Motor"

      - id: robo_q8
        type: "parsons"
        prompt: "Order the code to make a robot blink an LED."
        blocks:
          - "turn LED on"
          - "wait 1 second"
          - "turn LED off"
          - "wait 1 second"
        answer: [0, 1, 2, 3]

      - id: robo_q9
        type: "multiple_choice"
        prompt: "What is a 'LIDAR' sensor used for?"
        options:
          - "Measuring temperature"
          - "Mapping environments using laser light"
          - "Detecting magnetic fields"
          - "Recording audio"
        answer: "Mapping environments using laser light"

      - id: robo_q10
        type: "multiple_choice"
        prompt: "What does PWM stand for (used for controlling motor speed)?"
        options:
          - "Power With Motion"
          - "Pulse Width Modulation"
          - "Program Width Mode"
          - "Position Wire Map"
        answer: "Pulse Width Modulation"

