- id: robo_q46
  type: multiple_choice
  prompt: What is obstacle avoidance?
  options:
  - Detecting and navigating around obstacles
  - Ignoring obstacles
  - Pushing through obstacles
  - Stopping at all obstacles
  answer: Detecting and navigating around obstacles
- id: robo_q47
  type: multiple_choice
  prompt: What type of sensor is best for detecting nearby obstacles?
  options:
  - Ultrasonic or infrared proximity sensor
  - Temperature sensor
  - Light sensor
  - Humidity sensor
