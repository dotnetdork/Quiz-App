  code: |
    for i in range(1, 4):
        print(i)
  options:
  - '2'
  - '3'
  - '4'
  - '5'
  answer: '3'
- id: loop_q11
  type: multiple_choice
  prompt: What does the break statement do?
  options:
  - Pauses the loop
  - Exits the loop immediately
  - Skips to the next iteration
  - Restarts the loop
  answer: Exits the loop immediately
- id: loop_q12
  type: output_prediction
  prompt: How many numbers will be printed?
  code: |
    for i in range(10):
        if i == 5:
            break
        print(i)
  options:
  - '4'
  - '5'
  - '6'
  - '10'
  answer: '5'
- id: loop_q13
  type: multiple_choice
  prompt: What does the continue statement do?
  options:
  - Exits the loop
  - Skips the rest of the current iteration
  - Restarts the loop from beginning
  - Does nothing
  answer: Skips the rest of the current iteration
- id: loop_q14
  type: output_prediction
  prompt: What numbers will be printed?
  code: |
    for i in range(5):
        if i == 2:
            continue
        print(i, end=' ')
  options:
  - 0 1 2 3 4
  - 0 1 3 4
  - 1 2 3 4
  - 0 1 2
  answer: 0 1 3 4
