id: loops_module_01
title: Loops
description: Test your knowledge of for loops, while loops, range, iterables, and loop control
category: python
questions:
- id: loop_q1
  type: multiple_choice
  prompt: Which statement creates a for loop that repeats 5 times?
  options:
  - 'for i in 5:'
  - 'for i in range(5):'
  - 'for i = 0 to 5:'
  - 'repeat 5 times:'
  answer: 'for i in range(5):'
- id: loop_q2
  type: output_prediction
  prompt: How many times will 'Hello' be printed?
  code: |
    for i in range(3):
        print('Hello')
  options:
  - '2'
  - '3'
  - '4'
  - infinite
  answer: '3'
- id: loop_q3
  type: multiple_choice
  prompt: What does range(1, 6) generate?
  options:
  - Numbers 1, 2, 3, 4, 5
  - Numbers 0, 1, 2, 3, 4, 5
  - Numbers 1, 2, 3, 4, 5, 6
  - Numbers 0, 1, 2, 3, 4
  answer: Numbers 1, 2, 3, 4, 5
- id: loop_q4
  type: output_prediction
  prompt: What will this code output?
  code: |
    for i in range(2, 8, 2):
        print(i, end=' ')
  options:
  - 2 4 6 8
  - 2 4 6
  - 0 2 4 6
  - 2 3 4 5 6 7
  answer: 2 4 6
- id: loop_q5
  type: free_response
  prompt: What keyword starts a for loop in Python?
  answer: for
  case_sensitive: false
