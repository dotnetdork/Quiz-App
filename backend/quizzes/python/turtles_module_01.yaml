- id: turtle_q14
  type: multiple_choice
  prompt: What does tina.goto(0, 0) do?
  options:
  - Moves turtle to the center of the screen
  - Resets the turtle completely
  - Clears the drawing
  - Rotates to face coordinates (0,0)
  answer: Moves turtle to the center of the screen
- id: turtle_q15
  type: debugging
  prompt: What is the bug in this code?
  code: |
    import turtle
    tina = turtle.Turtle()
    tina.pencolor('red')
    tina.fillcolor('blue')
    tina.forward(100)
    tina.left(90)
    tina.forward(100)
  options:
  - Missing begin_fill() and end_fill() to actually fill the shape
  - pencolor should be pen_color
  - fillcolor should take RGB values
  - forward and left are in wrong order
  answer: Missing begin_fill() and end_fill() to actually fill the shape
