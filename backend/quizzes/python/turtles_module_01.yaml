id: turtles_module_01
title: Python Turtles - Module 10
description: Test your knowledge of Python turtle graphics, including basic commands, loops, functions, and creative patterns
category: python
questions:
- id: turtle_q1
  type: multiple_choice
  prompt: Which statement correctly imports the turtle module?
  options:
  - from turtle import *
  - import turtle
  - include turtle
  - require turtle
  answer: import turtle
- id: turtle_q2
  type: multiple_choice
  prompt: How do you create a new turtle named 'tina'?
  options:
  - tina = turtle.new()
  - tina = turtle.Turtle()
  - tina = turtle.create()
  - tina = Turtle()
  answer: tina = turtle.Turtle()
- id: turtle_q3
  type: output_prediction
  prompt: What shape will this turtle draw?
  code: |
    import turtle
    tina = turtle.Turtle()
    for i in range(4):
        tina.forward(100)
        tina.left(90)
  options:
  - Triangle
  - Square
  - Pentagon
  - Circle
  answer: Square
- id: turtle_q4
  type: multiple_choice
  prompt: Which method moves the turtle forward by a specified distance?
  options:
  - tina.move(100)
  - tina.forward(100)
  - tina.go(100)
  - tina.advance(100)
  answer: tina.forward(100)
- id: turtle_q5
  type: multiple_choice
  prompt: What does tina.penup() do?
  options:
  - Raises the pen so the turtle moves without drawing
  - Increases the pen width
  - Changes the pen color
  - Rotates the pen upward
  answer: Raises the pen so the turtle moves without drawing
- id: turtle_q6
  type: fill_in_blank
  prompt: Fill in the blank to turn the turtle right by 90 degrees.
  code: |
    tina.___(90)
  options:
  - turn
  - rotate
  - right
  - angle
  answer: right
- id: turtle_q7
  type: debugging
  prompt: What is wrong with this code?
  code: |
    import turtle
    tina = turtle.Turtle()
    tina.forward(100)
    tina.left(45)
    tina.forward(100)
    # Window closes immediately
  options:
  - Missing turtle.done() or turtle.exitonclick()
  - forward() should be move()
  - left() should take radians not degrees
  - tina was not created properly
  answer: Missing turtle.done() or turtle.exitonclick()
- id: turtle_q8
  type: free_response
  prompt: What method changes the turtle's pen color?
  answer: pencolor
  case_sensitive: false
