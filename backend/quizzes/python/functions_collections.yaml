id: functions_collections
title: Functions and Collections
description: Master functions, exception handling, and Python's powerful collection types including lists, tuples, sets, and dictionaries
category: python
questions:
- id: func_q1
  type: multiple_choice
  prompt: What keyword is used to define a function?
  options:
  - function
  - def
  - define
  - func
  answer: def
- id: func_q2
  type: parsons
  prompt: Arrange these lines to define a simple function.
  blocks:
  - 'def greet(name):'
  - '    message = f"Hello, {name}"'
  - '    return message'
  answer:
  - 0
  - 1
  - 2
- id: func_q3
  type: output_prediction
  prompt: What will this function return?
  code: |
    def add(a, b):
        return a + b
    
    result = add(5, 3)
  options:
  - '5'
  - '3'
  - '8'
  - 'None'
  answer: '8'
