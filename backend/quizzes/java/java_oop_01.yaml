id: java_oop_01
title: OOP & Logic
description: Dive into object-oriented programming with classes, objects, inheritance, encapsulation, and polymorphism
category: java
questions:
- id: java_oop_q1
  type: multiple_choice
  prompt: Which concept allows a class to acquire properties and methods from another
    class?
  options:
  - Polymorphism
  - Inheritance
  - Encapsulation
  - Abstraction
  answer: Inheritance
- id: java_oop_q2
  type: parsons
  prompt: Arrange the code to create an object of class 'Car'.
  blocks:
  - public class Main {
  - '    public static void main(String[] args) {'
  - '        Car myCar = new Car();'
  - '    }'
  - '}'
  answer:
  - 0
  - 1
  - 2
  - 3
  - 4
- id: java_oop_q3
  type: multiple_choice
  prompt: Which keyword refers to the current object instance?
  options:
  - super
  - this
  - that
  - object
  answer: this
- id: java_oop_q4
  type: multiple_choice
  prompt: Which access modifier makes a variable visible only within its own class?
  options:
  - public
  - protected
  - private
  - package
  answer: private
- id: java_oop_q5
  type: parsons
  prompt: Order the code to handle an exception using try-catch.
  blocks:
  - try {
  - '    int data = 50 / 0;'
  - '} catch (ArithmeticException e) {'
  - '    System.out.println(e);'
  - '}'
  answer:
  - 0
  - 1
  - 2
  - 3
  - 4
- id: java_oop_q6
  type: multiple_choice
  prompt: What is a constructor?
  options:
  - A method that destroys objects
  - A special method called when an object is created
  - A variable that holds class data
  - A tool to build Java files
  answer: A special method called when an object is created
- id: java_oop_q7
  type: multiple_choice
  prompt: Which keyword is used to import a package?
  options:
  - package
  - get
  - import
  - include
  answer: import
- id: java_oop_q8
  type: parsons
  prompt: Create a subclass 'Dog' that extends 'Animal'.
  blocks:
  - public class Animal {
  - '}'
  - public class Dog extends Animal {
  - '}'
  answer:
  - 0
  - 1
  - 2
  - 3
- id: java_oop_q9
  type: multiple_choice
  prompt: Method Overloading occurs when...
  options:
  - A method has the same name but different parameters
  - A method is too long
  - A subclass provides a specific implementation of a method
  - A method calls itself
  answer: A method has the same name but different parameters
- id: java_oop_q10
  type: parsons
  prompt: Arrange the enhanced for-loop to print all names in an array.
  blocks:
  - String[] names = {"Code", "Tech"};
  - 'for (String i : names) {'
  - '    System.out.println(i);'
  - '}'
  answer:
  - 0
  - 1
  - 2
  - 3
- id: java_oop_q11
  type: multiple_choice
  prompt: An interface in Java is...
  options:
  - A concrete class with all methods defined
  - A blueprint of a class containing abstract methods
  - A graphical user window
  - A variable type
  answer: A blueprint of a class containing abstract methods
- id: java_oop_q12
  type: multiple_choice
  prompt: What does the 'static' keyword mean?
  options:
  - The variable can change frequently
  - The member belongs to the class, not instances
  - The code is frozen
  - The method is private
  answer: The member belongs to the class, not instances
- id: java_oop_q13
  type: parsons
  prompt: Order the code to define and call a method.
  blocks:
  - static void myMethod() {
  - '    System.out.println("Executed!");'
  - '}'
  - public static void main(String[] args) {
  - '    myMethod();'
  - '}'
  answer:
  - 0
  - 1
  - 2
  - 3
  - 4
  - 5
- id: java_oop_q14
  type: multiple_choice
  prompt: Which package is automatically imported in all Java programs?
  options:
  - java.util
  - java.io
  - java.lang
  - java.net
  answer: java.lang
- id: java_oop_q15
  type: multiple_choice
  prompt: What is the result of 10 > 9?
  options:
  - '1'
  - 'true'
  - '0'
  - 'false'
  answer: 'true'
- id: java_oop_q16
  type: multiple_choice
  prompt: What is encapsulation?
  options:
  - Hiding implementation details and exposing only necessary parts
  - Creating multiple classes
  - Using loops in methods
  - Importing packages
  answer: Hiding implementation details and exposing only necessary parts
- id: java_oop_q17
  type: multiple_choice
  prompt: What are getter methods used for?
  options:
  - To retrieve the value of private variables
  - To set the value of variables
  - To delete variables
  - To create new objects
  answer: To retrieve the value of private variables
- id: java_oop_q18
  type: parsons
  prompt: Arrange the code to create a simple class with encapsulation.
  blocks:
  - public class Person {
  - '    private String name;'
  - '    public String getName() {'
  - '        return name;'
  - '    }'
  - '    public void setName(String n) {'
  - '        name = n;'
  - '    }'
  - '}'
  answer:
  - 0
  - 1
  - 2
  - 3
  - 4
  - 5
  - 6
  - 7
  - 8
- id: java_oop_q19
  type: multiple_choice
  prompt: What is polymorphism?
  options:
  - Many forms of a single entity
  - Creating multiple objects
  - Using multiple loops
  - Importing multiple packages
  answer: Many forms of a single entity
- id: java_oop_q20
  type: multiple_choice
  prompt: What is method overriding?
  options:
  - Using the same method name in different classes with inheritance
  - Creating two methods with different names
  - Deleting a method
  - Making a method private
  answer: Using the same method name in different classes with inheritance
- id: java_oop_q21
  type: output_prediction
  prompt: What will this overridden method print?
  code: |
    class Animal {
        void sound() { System.out.println("Animal sound"); }
    }
    class Dog extends Animal {
        void sound() { System.out.println("Bark"); }
    }
    Dog d = new Dog();
    d.sound();
  options:
  - Animal sound
  - Bark
  - Both
  - error
  answer: Bark
- id: java_oop_q22
  type: multiple_choice
  prompt: Which annotation indicates a method is being overridden?
  options:
  - '@Override'
  - '@Overridden'
  - '@Super'
  - '@Parent'
  answer: '@Override'
- id: java_oop_q23
  type: multiple_choice
  prompt: What keyword calls the parent class constructor?
  options:
  - this
  - super
  - parent
  - base
  answer: super
- id: java_oop_q24
  type: parsons
  prompt: Arrange the code to call super class constructor.
  blocks:
  - class Animal {
  - '    Animal(String name) { System.out.println(name); }'
  - '}'
  - class Dog extends Animal {
  - '    Dog(String name) {'
  - '        super(name);'
  - '    }'
  - '}'
  answer:
  - 0
  - 1
  - 2
  - 3
  - 4
  - 5
  - 6
  - 7
- id: java_oop_q25
  type: multiple_choice
  prompt: What is an abstract class?
  options:
  - A class that cannot be instantiated directly
  - A class with only private methods
  - A class without variables
  - A class from java.lang
  answer: A class that cannot be instantiated directly
- id: java_oop_q26
  type: multiple_choice
  prompt: Which keyword defines an abstract class?
  options:
  - interface
  - abstract
  - virtual
  - incomplete
  answer: abstract
- id: java_oop_q27
  type: debugging
  prompt: What is wrong with this code?
  code: |
    abstract class Shape {
        abstract void draw();
    }
    Shape s = new Shape();
  options:
  - Cannot instantiate an abstract class
  - draw() method is missing body
  - Shape should be lowercase
  - Missing semicolon
  answer: Cannot instantiate an abstract class
- id: java_oop_q28
  type: multiple_choice
  prompt: How do you implement an interface?
  options:
  - extends
  - implements
  - uses
  - includes
  answer: implements
- id: java_oop_q29
  type: parsons
  prompt: Arrange the code to implement an interface.
  blocks:
  - interface Animal {
  - '    void sound();'
  - '}'
  - class Dog implements Animal {
  - '    public void sound() {'
  - '        System.out.println("Bark");'
  - '    }'
  - '}'
  answer:
  - 0
  - 1
  - 2
  - 3
  - 4
  - 5
  - 6
  - 7
- id: java_oop_q30
  type: multiple_choice
  prompt: Can a class implement multiple interfaces?
  options:
  - 'Yes'
  - 'No'
  - Only in Java 8+
  - Only if they are abstract
  answer: 'Yes'
- id: java_oop_q31
  type: multiple_choice
  prompt: What is the default access modifier for interface methods in Java 8+?
  options:
  - private
  - protected
  - public
  - default
  answer: public
- id: java_oop_q32
  type: fill_in_blank
  prompt: Fill in the blank to check if an object is an instance of a class.
  code: |
    Dog d = new Dog();
    if (d ___ Animal) {
        System.out.println("Is animal");
    }
  options:
  - is
  - instanceof
  - typeof
  - isInstance
  answer: instanceof
- id: java_oop_q33
  type: multiple_choice
  prompt: What does the final keyword do when applied to a class?
  options:
  - Prevents the class from being extended
  - Makes all methods static
  - Makes the class abstract
  - Prevents the class from being imported
  answer: Prevents the class from being extended
- id: java_oop_q34
  type: multiple_choice
  prompt: What does the final keyword do when applied to a method?
  options:
  - Prevents the method from being overridden
  - Makes the method private
  - Deletes the method
  - Makes the method static
  answer: Prevents the method from being overridden
- id: java_oop_q35
  type: output_prediction
  prompt: What will this code output?
  code: |
    final int MAX = 100;
    MAX = 200;
    System.out.println(MAX);
  options:
  - '100'
  - '200'
  - error (cannot reassign final variable)
  - '300'
  answer: error (cannot reassign final variable)
- id: java_oop_q36
  type: multiple_choice
  prompt: What is composition in OOP?
  options:
  - One class contains objects of other classes
  - Multiple inheritance
  - Using interfaces
  - Creating abstract classes
  answer: One class contains objects of other classes
- id: java_oop_q37
  type: multiple_choice
  prompt: What exception is thrown when dividing by zero?
  options:
  - DivideByZeroException
  - ArithmeticException
  - MathException
  - NumberException
  answer: ArithmeticException
