  type: parsons
  prompt: Arrange the code to throw a custom exception.
  blocks:
  - public void checkAge(int age) throws Exception {
  - '    if (age < 18) {'
  - '        throw new Exception("Too young");'
  - '    }'
  - '}'
  answer:
  - 0
  - 1
  - 2
  - 3
  - 4
- id: java_oop_q39
  type: multiple_choice
  prompt: What block always executes in exception handling?
  options:
  - try
  - catch
  - finally
  - always
  answer: finally
- id: java_oop_q40
  type: debugging
  prompt: What is wrong with this exception handling?
  code: |
    try {
        int[] arr = new int[5];
        arr[10] = 50;
    } catch (Exception e) {
    }
  options:
  - Nothing wrong, will catch ArrayIndexOutOfBoundsException
  - Missing finally block
  - try should be Try
  - Exception is too generic
  answer: Nothing wrong, will catch ArrayIndexOutOfBoundsException
- id: java_oop_q41
  type: multiple_choice
  prompt: What method is called when an object is garbage collected?
  options:
  - delete()
  - finalize()
  - destroy()
  - clean()
  answer: finalize()
- id: java_oop_q42
  type: multiple_choice
  prompt: Which method returns a string representation of an object?
  options:
  - getString()
  - toStr()
  - toString()
  - asString()
  answer: toString()
- id: java_oop_q43
  type: faded_parsons
  prompt: Complete the code to override toString(). The class declaration is fixed.
  blocks:
  - public class Person {
  - '    String name;'
  - '    public String toString() {'
  - '        return "Person: " + name;'
  - '    }'
  - '}'
  fixed_indices:
  - 0
  - 5
  answer:
  - 1
  - 2
  - 3
  - 4
- id: java_oop_q44
  type: multiple_choice
  prompt: What is a package in Java?
  options:
  - A group of related classes and interfaces
  - A compressed file
  - A method container
  - A type of variable
  answer: A group of related classes and interfaces
- id: java_oop_q45
  type: multiple_choice
  prompt: Which keyword creates a package?
  options:
  - namespace
  - package
  - module
  - group
  answer: package
- id: java_oop_q46
  type: output_prediction
  prompt: What access do protected members have?
  code: |
    // In package com.example
    public class Parent {
        protected int value = 10;
    }
  options:
  - Only within Parent class
  - Within package and subclasses
  - Everywhere
  - Only subclasses
  answer: Within package and subclasses
- id: java_oop_q47
  type: multiple_choice
  prompt: What is the difference between == and equals()?
  options:
  - == compares references, equals() compares content
  - They are the same
  - equals() compares references
  - == is for strings only
  answer: == compares references, equals() compares content
- id: java_oop_q48
  type: fill_in_blank
  prompt: Fill in the blank to create an anonymous inner class.
  code: |
    Runnable r = new Runnable() {
        ___ void run() {
            System.out.println("Running");
        }
    };
  options:
  - override
  - public
  - static
  - private
  answer: public
- id: java_oop_q49
  type: multiple_choice
  prompt: What is a static nested class?
  options:
  - A class defined inside another class with static keyword
  - A class that cannot be instantiated
  - A class with all static methods
  - An abstract class
  answer: A class defined inside another class with static keyword
- id: java_oop_q50
  type: multiple_choice
  prompt: What is the parent class of all classes in Java?
  options:
  - Parent
  - Base
  - Object
  - Super
  answer: Object
