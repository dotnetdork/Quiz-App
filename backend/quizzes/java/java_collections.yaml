id: java_collections
title: Collections Framework
description: Master ArrayList, HashMap, Set, Queue, and the powerful Collections Framework
category: java
questions:
- id: coll_q1
  type: multiple_choice
  prompt: What interface is the root of the Collections hierarchy?
  options:
  - List
  - Set
  - Collection
  - Map
  answer: Collection
- id: coll_q2
  type: multiple_choice
  prompt: Which collection allows duplicate elements?
  options:
  - Set
  - List
  - TreeSet
  - HashSet
  answer: List
- id: coll_q3
  type: multiple_choice
  prompt: Which collection does NOT allow duplicate elements?
  options:
  - ArrayList
  - LinkedList
  - Set
  - Vector
  answer: Set
- id: coll_q4
  type: multiple_choice
  prompt: What is the key difference between ArrayList and LinkedList?
  options:
  - ArrayList uses dynamic array, LinkedList uses doubly-linked list
  - They are the same
  - ArrayList is slower
  - LinkedList doesn't allow duplicates
  answer: ArrayList uses dynamic array, LinkedList uses doubly-linked list
- id: coll_q5
  type: output_prediction
  prompt: What will this code output?
  code: |
    List<String> list = new ArrayList<>();
    list.add("Hello");
    list.add("World");
    System.out.println(list.get(0));
  options:
  - World
  - Hello
  - Both
  - error
  answer: Hello
- id: coll_q6
  type: multiple_choice
  prompt: Which operation is faster in ArrayList?
  options:
  - Random access by index
  - Insertion in the middle
  - Deletion from the middle
  - Adding at the beginning
  answer: Random access by index
- id: coll_q7
  type: multiple_choice
  prompt: Which operation is faster in LinkedList?
  options:
  - Random access by index
  - Insertion/deletion at beginning or end
  - Sorting
  - Searching
  answer: Insertion/deletion at beginning or end
- id: coll_q8
  type: parsons
  prompt: Arrange the code to create and add elements to an ArrayList.
  blocks:
  - List<Integer> numbers = new ArrayList<>();
  - numbers.add(10);
  - numbers.add(20);
  - numbers.add(30);
  - System.out.println(numbers);
  answer:
  - 0
  - 1
  - 2
  - 3
  - 4
