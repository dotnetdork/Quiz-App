id: java_basics
title: Fundamentals
description: Build a strong foundation in Java syntax, variables, data types, and core programming concepts
category: java
questions:
- id: java_q1
  type: multiple_choice
  prompt: Which keyword is used to create a class in Java?
  options:
  - def
  - class
  - struct
  - type
  answer: class
- id: java_q2
  type: multiple_choice
  prompt: What is the correct way to declare a main method in Java?
  options:
  - 'def main():'
  - function main()
  - public static void main(String[] args)
  - void main()
  answer: public static void main(String[] args)
- id: java_q3
  type: multiple_choice
  prompt: Which data type is used to store text?
  options:
  - string
  - String
  - Txt
  - Char
  answer: String
- id: java_q4
  type: multiple_choice
  prompt: How do you end a statement in Java?
  options:
  - .
  - ':'
  - ;
  - '}'
  answer: ;
- id: java_q5
  type: parsons
  prompt: Arrange the code to print 'Hello Java' to the console.
  blocks:
  - public class Main {
  - '    public static void main(String[] args) {'
  - '        System.out.println("Hello Java");'
  - '    }'
  - '}'
  answer:
  - 0
  - 1
  - 2
  - 3
  - 4
- id: java_q6
  type: multiple_choice
  prompt: Which variable type stores whole numbers?
  options:
  - float
  - int
  - double
  - boolean
  answer: int
- id: java_q7
  type: parsons
  prompt: Reorder to declare an integer and assign it a value.
  blocks:
  - int myNum;
  - myNum = 15;
  - System.out.println(myNum);
  answer:
  - 0
  - 1
  - 2
- id: java_q8
  type: multiple_choice
  prompt: How do you write a single-line comment in Java?
  options:
  - '#'
  - //
  - /*
  - --
  answer: //
- id: java_q9
  type: multiple_choice
  prompt: Which keyword creates a variable that cannot be changed (constant)?
  options:
  - static
  - final
  - const
  - abstract
  answer: final
- id: java_q10
  type: parsons
  prompt: Construct a standard 'if' statement in Java.
  blocks:
  - int x = 20;
  - if (x > 18) {
  - '    System.out.println("Adult");'
  - '}'
  answer:
  - 0
  - 1
  - 2
  - 3
- id: java_q11
  type: multiple_choice
  prompt: Which operator is used to compare two values for equality?
  options:
  - '='
  - ==
  - <>
  - equals
  answer: ==
- id: java_q12
  type: multiple_choice
  prompt: Arrays in Java are initialized with which brackets?
  options:
  - ()
  - '[]'
  - '{}'
  - <>
  answer: '{}'
- id: java_q13
  type: parsons
  prompt: Create a simple 'for' loop counting from 0 to 4.
  blocks:
  - for (int i = 0; i < 5; i++) {
  - '    System.out.println(i);'
  - '}'
  answer:
  - 0
  - 1
  - 2
- id: java_q14
  type: multiple_choice
  prompt: Which data type stores true or false values?
  options:
  - bool
  - Boolean
  - boolean
  - bit
  answer: boolean
- id: java_q15
  type: multiple_choice
  prompt: Which symbol calculates the remainder (modulus)?
  options:
  - /
  - '%'
  - '*'
  - \
  answer: '%'
- id: java_q16
  type: output_prediction
  prompt: What will this code output?
  code: |
    int x = 7;
    int y = 3;
    System.out.println(x / y);
  options:
  - '2.33'
  - '2'
  - '3'
  - '2.0'
  answer: '2'
- id: java_q17
  type: debugging
  prompt: What is wrong with this code?
  code: |
    String message = "Hello"
    System.out.println(message);
  options:
  - Missing semicolon after "Hello"
  - String should be lowercase
  - System.out.println is incorrect
  - message should be capitalized
  answer: Missing semicolon after "Hello"
- id: java_q18
  type: fill_in_blank
  prompt: Fill in the blank to initialize an array.
  code: |
    int[] numbers = ___ 1, 2, 3, 4, 5 ___;
  options:
  - '( and )'
  - '[ and ]'
  - 'new int[]{ and }'
  - '< and >'
  answer: 'new int[]{ and }'
- id: java_q19
  type: free_response
  prompt: What is the entry point method name for a Java application?
  answer: main
  case_sensitive: true
- id: java_q20
  type: faded_parsons
  prompt: Complete this method by arranging the movable lines. The method signature is already in place.
  blocks:
  - 'public static int add(int a, int b) {'
  - '    int sum = a + b;'
  - '    return sum;'
  - '}'
  fixed_indices:
  - 0
  - 3
  answer:
  - 1
  - 2
- id: java_q21
  type: multiple_choice
  prompt: What does the ++ operator do?
  options:
  - Decrements by 1
  - Increments by 1
  - Multiplies by 2
  - Adds 10
  answer: Increments by 1
- id: java_q22
  type: output_prediction
  prompt: What will this code output?
  code: |
    int x = 5;
    System.out.println(++x);
  options:
  - '4'
  - '5'
  - '6'
  - error
  answer: '6'
- id: java_q23
  type: multiple_choice
  prompt: Which keyword is used for selection between multiple cases?
  options:
  - if
  - when
  - switch
  - select
  answer: switch
- id: java_q24
  type: parsons
  prompt: Arrange the code to create a switch statement.
  blocks:
  - int day = 2;
  - switch (day) {
  - '    case 1:'
  - '        System.out.println("Monday");'
  - '        break;'
  - '    default:'
  - '        System.out.println("Other");'
  - '}'
  answer:
  - 0
  - 1
  - 2
  - 3
  - 4
  - 5
  - 6
  - 7
- id: java_q25
  type: multiple_choice
  prompt: What keyword exits a loop early?
  options:
  - exit
  - stop
  - break
  - return
  answer: break
- id: java_q26
  type: multiple_choice
  prompt: What keyword skips to the next iteration of a loop?
  options:
  - skip
  - next
  - continue
  - pass
  answer: continue
- id: java_q27
  type: output_prediction
  prompt: What will this loop print last?
  code: |
    for (int i = 1; i <= 3; i++) {
        System.out.println(i);
    }
  options:
  - '1'
  - '2'
  - '3'
  - '4'
  answer: '3'
- id: java_q28
  type: multiple_choice
  prompt: Which loop always executes at least once?
  options:
  - for loop
  - while loop
  - do-while loop
  - if loop
  answer: do-while loop
- id: java_q29
  type: parsons
  prompt: Arrange the code for a while loop that counts from 1 to 3.
  blocks:
  - int i = 1;
  - while (i <= 3) {
  - '    System.out.println(i);'
  - '    i++;'
  - '}'
  answer:
  - 0
  - 1
  - 2
  - 3
  - 4
- id: java_q30
  type: debugging
  prompt: What is wrong with this while loop?
  code: |
    int x = 0;
    while (x < 5) {
        System.out.println(x);
    }
  options:
  - x is never incremented (infinite loop)
  - while should be While
  - Missing semicolon
  - Condition is wrong
  answer: x is never incremented (infinite loop)
- id: java_q31
  type: multiple_choice
  prompt: How do you get the length of a String?
  options:
  - str.size()
  - str.length()
  - str.len()
  - str.count()
  answer: str.length()
- id: java_q32
  type: output_prediction
  prompt: What will this code output?
  code: |
    String text = "Java";
    System.out.println(text.toUpperCase());
  options:
  - java
  - Java
  - JAVA
  - error
  answer: JAVA
- id: java_q33
  type: multiple_choice
  prompt: Which method compares two strings for equality?
  options:
  - ==
  - equals()
  - compare()
  - isEqual()
